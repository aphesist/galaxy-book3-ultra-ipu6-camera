# Image tuning for the OV02C10 through Intel's IPU6 pipeline (libcamera-ipu6
# with 0003-ipu6-add-ov02c10.patch). Read by PipeWire/WirePlumber at login.
# Install: cp to ~/.config/environment.d/, then log out and back in
# (or: systemctl --user restart pipewire wireplumber after
#  systemctl --user import-environment, see README).
#
# Noise reduction and sharpness: -100..100 (unset = Intel tuning default).
# Intel's tuning over-smooths this module; minimum NR + extra sharpness
# looked best.
IPU6_NR_SPATIAL=-100
IPU6_NR_TEMPORAL=-100
IPU6_SHARPNESS=70
# White balance shift "r,g,b", 0..255 each, equal = neutral. Lower g pulls
# out the green cast of the borrowed tuning.
IPU6_AWB_SHIFT=128,104,128
# Frame-rate range "min,max". Unset = auto (drops to ~20 fps in dim light
# for a brighter image). "30,30" = smooth but darker.
#IPU6_FPS_RANGE=30,30
